<!DOCTYPE html>
<html lang="en">
<head>
<style>
    body, html {
        margin: 0; padding: 0;
        width: 2100px; height: 2970px;
        background-color: #121212;
        overflow: hidden; position: relative;
    }
    .diag {
        position: absolute;
        background-color: #3776AB;
        transform: rotate(45deg);
    }
    .diag1 {
        top: -300px; left: -500px;
        width: 1500px; height: 300px;
    }
    .diag2 {
        bottom: -400px; right: -600px;
        width: 2000px; height: 400px;
        background-color: #FFD43B;
    }
</style>
</head>
<body>
    <div class="diag diag1"></div>
    <div class="diag diag2"></div>
</body>
</html>
