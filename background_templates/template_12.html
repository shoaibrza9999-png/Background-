<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiber Optics - A4 Portrait</title>
<style>
    body, html {
        margin: 0;
        padding: 0;
        width: 2100px;
        height: 2970px;
        background-color: #050508;
        overflow: hidden;
        position: relative;
    }

    /* Base Gradient */
    .bg-gradient {
        position: absolute;
        width: 100%;
        height: 100%;
        background: linear-gradient(180deg, rgba(0,255,204,0.05) 0%, rgba(5,5,8,1) 40%, rgba(5,5,8,1) 60%, rgba(255,0,128,0.05) 100%);
        z-index: 0;
    }

    /* Vertical Fiber Lines */
    .fiber {
        position: absolute;
        height: 100%;
        width: 4px;
        border-radius: 2px;
        z-index: 1;
    }

    /* Cyan Lines Top */
    .line-1 { left: 10%; top: -30%; background: linear-gradient(180deg, #00ffcc, transparent); box-shadow: 0 0 20px #00ffcc; }
    .line-2 { left: 25%; top: -60%; background: linear-gradient(180deg, #00ffcc, transparent); box-shadow: 0 0 20px #00ffcc; }
    .line-3 { left: 85%; top: -40%; background: linear-gradient(180deg, #00ffcc, transparent); box-shadow: 0 0 20px #00ffcc; }

    /* Magenta Lines Bottom */
    .line-4 { left: 15%; bottom: -50%; background: linear-gradient(0deg, #ff007f, transparent); box-shadow: 0 0 20px #ff007f; }
    .line-5 { left: 75%; bottom: -30%; background: linear-gradient(0deg, #ff007f, transparent); box-shadow: 0 0 20px #ff007f; }
    .line-6 { left: 90%; bottom: -60%; background: linear-gradient(0deg, #ff007f, transparent); box-shadow: 0 0 20px #ff007f; }

</style>
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="fiber line-1"></div>
    <div class="fiber line-2"></div>
    <div class="fiber line-3"></div>
    <div class="fiber line-4"></div>
    <div class="fiber line-5"></div>
    <div class="fiber line-6"></div>
</body>
</html>
