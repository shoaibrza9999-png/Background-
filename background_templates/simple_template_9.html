<!DOCTYPE html>
<html lang="en">
<head>
<style>
    body, html {
        margin: 0; padding: 0;
        width: 2100px; height: 2970px;
        background-color: #ffffff;
        overflow: hidden; position: relative;
    }
    .circle-large {
        position: absolute;
        border-radius: 50%;
    }
    .c1 {
        top: -600px; left: -600px;
        width: 1600px; height: 1600px;
        background-color: #e7f5ff;
    }
    .c2 {
        bottom: -800px; right: -400px;
        width: 2000px; height: 2000px;
        background-color: #fff3bf;
    }
    .c3 {
        bottom: 200px; right: 800px;
        width: 400px; height: 400px;
        border: 10px solid #ffe066;
        background: transparent;
    }
</style>
</head>
<body>
    <div class="circle-large c1"></div>
    <div class="circle-large c2"></div>
    <div class="circle-large c3"></div>
</body>
</html>
