<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Light Blueprint - A4 Portrait</title>
<style>
    body, html {
        margin: 0;
        padding: 0;
        width: 2100px;
        height: 2970px;
        background-color: #f8f9fa; /* Off-white */
        overflow: hidden;
        position: relative;
    }

    /* Engineering Square Grid */
    .grid {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-size: 100px 100px;
        background-image:
            linear-gradient(to right, rgba(0, 0, 0, 0.05) 2px, transparent 2px),
            linear-gradient(to bottom, rgba(0, 0, 0, 0.05) 2px, transparent 2px);
        z-index: 1;
    }

    /* Accent Lines on the left edge */
    .accent-blue {
        position: absolute;
        top: 0;
        left: 0;
        width: 20px;
        height: 100%;
        background-color: #3776AB;
        z-index: 2;
    }

    .accent-yellow {
        position: absolute;
        top: 0;
        left: 20px;
        width: 20px;
        height: 100%;
        background-color: #FFD43B;
        z-index: 2;
    }

    /* Soft center glow to frame the code */
    .center-light {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 1800px;
        height: 2400px;
        background: radial-gradient(circle, #ffffff 0%, rgba(255, 255, 255, 0) 70%);
        z-index: 0;
    }
</style>
</head>
<body>
    <div class="center-light"></div>
    <div class="grid"></div>
    <div class="accent-blue"></div>
    <div class="accent-yellow"></div>
</body>
</html>
