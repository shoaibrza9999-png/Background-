<!DOCTYPE html>
<html lang="en">
<head>
<style>
    body, html { margin: 0; padding: 0; width: 2100px; height: 2970px; background-color: #2c3e50; overflow: hidden; position: relative; }
    .contour { position: absolute; border-radius: 50%; border: 4px solid rgba(236, 240, 241, 0.15); z-index: 0; }
    .c1 { width: 3000px; height: 2500px; top: -500px; left: -500px; }
    .c2 { width: 2600px; height: 2100px; top: -300px; left: -300px; }
    .c3 { width: 2200px; height: 1700px; top: -100px; left: -100px; }
    .c4 { width: 1800px; height: 1300px; top: 100px; left: 100px; }
    .c5 { width: 1400px; height: 900px; top: 300px; left: 300px; border-color: rgba(231, 76, 60, 0.4); }
    .content-area { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 1600px; height: 2400px; background: rgba(44, 62, 80, 0.8); border: 2px solid #ecf0f1; border-radius: 20px; z-index: 1; }
</style></head>
<body><div class="contour c1"></div><div class="contour c2"></div><div class="contour c3"></div><div class="contour c4"></div><div class="contour c5"></div><div class="content-area"></div></body></html>
