<!DOCTYPE html>
<html lang="en">
<head>
<style>
    body, html { margin: 0; padding: 0; width: 2100px; height: 2970px; background-color: #f4f0e6; overflow: hidden; position: relative; }
    .tape { position: absolute; background-color: rgba(255,235,150,0.8); box-shadow: 2px 2px 10px rgba(0,0,0,0.1); z-index: 3; }
    .t1 { width: 400px; height: 60px; top: 180px; left: 850px; transform: rotate(-3deg); }
    .t2 { width: 300px; height: 50px; bottom: 200px; right: 150px; transform: rotate(5deg); }
    .brutal-box { position: absolute; top: 250px; left: 150px; width: 1800px; height: 2470px; background-color: white; border: 15px solid black; box-shadow: 30px 30px 0px #ff3366; z-index: 1; }
    .accent-box { position: absolute; top: 150px; left: 50px; width: 400px; height: 400px; background-color: #33ccff; border: 10px solid black; z-index: 0; }
</style></head>
<body><div class="accent-box"></div><div class="brutal-box"></div><div class="tape t1"></div><div class="tape t2"></div></body></html>
