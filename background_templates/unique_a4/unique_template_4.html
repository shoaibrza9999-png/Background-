<!DOCTYPE html>
<html lang="en">
<head>
<style>
    body, html { margin: 0; padding: 0; width: 2100px; height: 2970px; background-color: #1a1a24; overflow: hidden; position: relative; }
    .orb { position: absolute; border-radius: 50%; box-shadow: inset -40px -40px 100px rgba(0,0,0,0.5), inset 40px 40px 100px rgba(255,255,255,0.8); z-index: 1; }
    .o1 { width: 800px; height: 800px; top: -100px; left: -200px; background: linear-gradient(135deg, #ff9a9e, #fecfef); }
    .o2 { width: 1200px; height: 1200px; bottom: 200px; right: -300px; background: linear-gradient(135deg, #a18cd1, #fbc2eb); }
    .o3 { width: 500px; height: 500px; top: 40%; left: 20%; background: linear-gradient(135deg, #84fab0, #8fd3f4); z-index: 3; }
    .glass-panel { position: absolute; top: 200px; left: 150px; width: 1800px; height: 2570px; background: rgba(255, 255, 255, 0.1); border-radius: 40px; backdrop-filter: blur(40px); border: 2px solid rgba(255,255,255,0.2); z-index: 2; }
</style></head>
<body><div class="orb o1"></div><div class="orb o2"></div><div class="glass-panel"></div><div class="orb o3"></div></body></html>
