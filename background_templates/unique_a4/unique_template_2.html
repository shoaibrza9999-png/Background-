<!DOCTYPE html>
<html lang="en">
<head>
<style>
    body, html { margin: 0; padding: 0; width: 2100px; height: 2970px; background-color: #e0e5ec; overflow: hidden; position: relative; }
    .neu-frame { position: absolute; top: 200px; left: 200px; width: 1700px; height: 2570px; border-radius: 60px; background: #e0e5ec; box-shadow: 30px 30px 60px #a3b1c6, -30px -30px 60px #ffffff; z-index: 1; }
    .neu-circle { position: absolute; top: 400px; right: 300px; width: 400px; height: 400px; border-radius: 50%; background: #e0e5ec; box-shadow: inset 20px 20px 40px #a3b1c6, inset -20px -20px 40px #ffffff; z-index: 2; }
    .neu-bar { position: absolute; top: 300px; left: 300px; width: 600px; height: 40px; border-radius: 20px; background: #e0e5ec; box-shadow: inset 10px 10px 20px #a3b1c6, inset -10px -10px 20px #ffffff; z-index: 2; }
</style></head>
<body><div class="neu-frame"><div class="neu-circle"></div><div class="neu-bar"></div></div></body></html>
