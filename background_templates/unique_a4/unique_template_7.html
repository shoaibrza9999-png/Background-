<!DOCTYPE html>
<html lang="en">
<head>
<style>
    body, html { margin: 0; padding: 0; width: 2100px; height: 2970px; background-color: #000; overflow: hidden; position: relative; }
    .spill { position: absolute; filter: blur(80px); opacity: 0.7; z-index: 0; border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; }
    .s1 { width: 1800px; height: 1800px; top: -200px; left: -400px; background: radial-gradient(circle, #ff00cc, #333399); transform: rotate(45deg); }
    .s2 { width: 2000px; height: 1600px; bottom: -300px; right: -500px; background: radial-gradient(circle, #00ffff, #0033cc); transform: rotate(-30deg); }
    .s3 { width: 1000px; height: 1500px; top: 30%; left: 30%; background: radial-gradient(circle, #ffff00, #ff6600); mix-blend-mode: color-dodge; }
</style></head>
<body><div class="spill s1"></div><div class="spill s2"></div><div class="spill s3"></div></body></html>
