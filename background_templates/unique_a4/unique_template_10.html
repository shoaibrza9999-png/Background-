<!DOCTYPE html>
<html lang="en">
<head>
<style>
    body, html { margin: 0; padding: 0; width: 2100px; height: 2970px; background-color: #0b1a2a; overflow: hidden; position: relative; }
    .poly { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); border: 8px solid rgba(0, 200, 255, 0.3); clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); z-index: 0; }
    .p1 { width: 3000px; height: 3464px; border-color: rgba(0,200,255,0.05); }
    .p2 { width: 2400px; height: 2771px; border-color: rgba(0,200,255,0.1); }
    .p3 { width: 1800px; height: 2078px; border-color: rgba(0,200,255,0.2); }
    .p4 { width: 1200px; height: 1385px; border-color: rgba(0,200,255,0.5); }
    .p5 { width: 600px; height: 692px; background-color: rgba(0,200,255,0.1); border-color: rgba(0,200,255,0.8); box-shadow: 0 0 100px #00c8ff; }
</style></head>
<body><div class="poly p1"></div><div class="poly p2"></div><div class="poly p3"></div><div class="poly p4"></div><div class="poly p5"></div></body></html>
