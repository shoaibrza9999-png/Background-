<!DOCTYPE html>
<html lang="en">
<head>
<style>
    body, html { margin: 0; padding: 0; width: 2100px; height: 2970px; background-color: #ffe066; overflow: hidden; position: relative; }
    .halftone { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: radial-gradient(#f03e3e 30%, transparent 30%), radial-gradient(#f03e3e 30%, transparent 30%); background-size: 40px 40px; background-position: 0 0, 20px 20px; opacity: 0.2; z-index: 0; }
    .pop-shape { position: absolute; background-color: #1c7ed6; border: 15px solid #000; box-shadow: 25px 25px 0px #000; z-index: 1; }
    .p1 { width: 800px; height: 800px; border-radius: 50%; top: -100px; left: -100px; }
    .p2 { width: 1000px; height: 400px; bottom: 200px; right: 200px; transform: rotate(-15deg); background-color: #ff922b; }
    .white-frame { position: absolute; top: 300px; left: 250px; width: 1600px; height: 2370px; background-color: white; border: 15px solid black; z-index: 2; }
</style></head>
<body><div class="halftone"></div><div class="pop-shape p1"></div><div class="pop-shape p2"></div><div class="white-frame"></div></body></html>
