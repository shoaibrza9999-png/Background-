<!DOCTYPE html>
<html lang="en">
<head>
<style>
    body, html { margin: 0; padding: 0; width: 2100px; height: 2970px; background-color: #2b003a; overflow: hidden; position: relative; }
    .sun { position: absolute; top: 10%; left: 50%; transform: translateX(-50%); width: 1400px; height: 1400px; background: linear-gradient(180deg, #ff007c 0%, #ff7a00 100%); border-radius: 50%; box-shadow: 0 0 150px #ff007c; z-index: 1; }
    .grid-bottom { position: absolute; bottom: 0; left: -50%; width: 200%; height: 60%; background-image: linear-gradient(rgba(0, 255, 255, 0.4) 2px, transparent 2px), linear-gradient(90deg, rgba(0, 255, 255, 0.4) 2px, transparent 2px); background-size: 150px 60px; transform: perspective(1000px) rotateX(60deg); z-index: 2; transform-origin: top; }
    .sun-cut { position: absolute; top: 10%; left: 50%; transform: translateX(-50%); width: 1400px; height: 1400px; background: repeating-linear-gradient(transparent, transparent 40px, #2b003a 40px, #2b003a 60px); z-index: 2; }
</style></head>
<body><div class="sun"></div><div class="sun-cut"></div><div class="grid-bottom"></div></body></html>
