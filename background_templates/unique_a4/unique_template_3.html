<!DOCTYPE html>
<html lang="en">
<head>
<style>
    body, html { margin: 0; padding: 0; width: 2100px; height: 2970px; background-color: #050510; overflow: hidden; position: relative; font-family: monospace; color: #00ffcc;}
    .hex-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, rgba(0,255,204,0.1) 10%, transparent 80%); z-index: 0; }
    .hex { position: absolute; width: 300px; height: 346px; background-color: rgba(0, 255, 204, 0.05); clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); border: 2px solid #00ffcc; z-index: 1; }
    .h1 { top: 100px; left: -100px; } .h2 { top: 300px; left: 160px; } .h3 { bottom: 200px; right: -50px; transform: scale(1.5); opacity: 0.5; }
    .hud-line { position: absolute; top: 50%; left: 0; width: 100%; height: 2px; background-color: rgba(0, 255, 204, 0.5); z-index: 2; }
    .crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 200px; height: 200px; border: 4px dashed #ff0055; border-radius: 50%; z-index: 3; }
</style></head>
<body><div class="hex-bg"></div><div class="hex h1"></div><div class="hex h2"></div><div class="hex h3"></div><div class="hud-line"></div><div class="crosshair"></div></body></html>
