<!DOCTYPE html>
<html lang="en">
<head>
<style>
    body, html {
        margin: 0; padding: 0;
        width: 2100px; height: 2970px;
        background-color: #2b2b2b;
        overflow: hidden; position: relative;
    }
    .border-box {
        position: absolute;
        border: 15px solid #60a5fa;
    }
    .box-top {
        top: 150px; left: 150px;
        width: 1770px; height: 600px;
        border-bottom: none;
    }
    .box-bottom {
        bottom: 150px; left: 150px;
        width: 1770px; height: 600px;
        border-top: none;
        border-color: #fca5a5;
    }
</style>
</head>
<body>
    <div class="border-box box-top"></div>
    <div class="border-box box-bottom"></div>
</body>
</html>
