<!DOCTYPE html>
<html lang="en">
<head>
<style>
    body, html {
        margin: 0; padding: 0;
        width: 2100px; height: 2970px;
        background-color: #e3fafc;
        overflow: hidden; position: relative;
    }
    .grid {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background-image: linear-gradient(#c5f6fa 2px, transparent 2px), linear-gradient(90deg, #c5f6fa 2px, transparent 2px);
        background-size: 100px 100px;
    }
    .square {
        position: absolute;
        background-color: #0c8599;
    }
    .sq1 { top: 200px; left: 200px; width: 200px; height: 200px; }
    .sq2 { top: 200px; left: 450px; width: 100px; height: 100px; background-color: #ffa94d; }
    .sq3 { bottom: 200px; right: 200px; width: 300px; height: 300px; opacity: 0.8; }
</style>
</head>
<body>
    <div class="grid"></div>
    <div class="square sq1"></div>
    <div class="square sq2"></div>
    <div class="square sq3"></div>
</body>
</html>
