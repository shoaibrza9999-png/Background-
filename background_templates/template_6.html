<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python Brand Fusion - A4 Portrait</title>
<style>
    body, html {
        margin: 0;
        padding: 0;
        width: 2100px;
        height: 2970px;
        background-color: #1a1a1d;
        overflow: hidden;
        position: relative;
    }

    /* Python Blue Glow */
    .glow-blue {
        position: absolute;
        top: -5%;
        left: -15%;
        width: 1600px;
        height: 1600px;
        background: radial-gradient(circle, rgba(55, 118, 171, 0.4) 0%, rgba(26, 26, 29, 0) 70%);
        border-radius: 50%;
        filter: blur(80px);
        z-index: 0;
    }

    /* Python Yellow/Gold Glow */
    .glow-yellow {
        position: absolute;
        bottom: -5%;
        right: -20%;
        width: 1800px;
        height: 1800px;
        background: radial-gradient(circle, rgba(255, 224, 102, 0.25) 0%, rgba(26, 26, 29, 0) 70%);
        border-radius: 50%;
        filter: blur(100px);
        z-index: 0;
    }

    /* Minimal geometric shapes framing the top and bottom */
    .shape {
        position: absolute;
        border-radius: 30px;
        background-color: rgba(255, 255, 255, 0.03);
        z-index: 1;
    }

    .shape-1 {
        width: 600px;
        height: 600px;
        top: 10%;
        left: 5%;
        transform: rotate(15deg);
    }

    .shape-2 {
        width: 500px;
        height: 500px;
        bottom: 12%;
        right: 8%;
        transform: rotate(-10deg);
    }
</style>
</head>
<body>
    <div class="glow-blue"></div>
    <div class="glow-yellow"></div>
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
</body>
</html>
