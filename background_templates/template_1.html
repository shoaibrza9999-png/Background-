<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python Code Background</title>
<style>
    /* Reset and set standard 1080p canvas size */
    body, html {
        margin: 0;
        padding: 0;
        width: 1920px;
        height: 1080px;
        background-color: #0d1117; /* GitHub Dark theme base */
        overflow: hidden;
        position: relative;
    }

    /* Subtle dot grid pattern */
    .grid-pattern {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1.5px, transparent 1.5px);
        background-size: 35px 35px;
        z-index: 1;
    }

    /* Python Blue Ambient Glow (Top Left) */
    .glow-blue {
        position: absolute;
        top: -15%;
        left: -10%;
        width: 1000px;
        height: 1000px;
        background: radial-gradient(circle, rgba(55, 118, 171, 0.4) 0%, rgba(13, 17, 23, 0) 70%);
        border-radius: 50%;
        filter: blur(80px);
        z-index: 0;
    }

    /* Python Yellow Ambient Glow (Bottom Right) */
    .glow-yellow {
        position: absolute;
        bottom: -25%;
        right: -10%;
        width: 1200px;
        height: 1200px;
        background: radial-gradient(circle, rgba(255, 212, 59, 0.15) 0%, rgba(13, 17, 23, 0) 70%);
        border-radius: 50%;
        filter: blur(100px);
        z-index: 0;
    }

    /* Top Accent Line */
    .accent-bar {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 6px;
        background: linear-gradient(90deg, #3776AB 0%, #FFD43B 100%);
        z-index: 2;
    }
</style>
</head>
<body>
    <div class="accent-bar"></div>

    <div class="glow-blue"></div>
    <div class="glow-yellow"></div>

    <div class="grid-pattern"></div>
</body>
</html>
