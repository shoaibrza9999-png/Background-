<!DOCTYPE html>

<title>A4 Bubble Template 3 - Neon Pastel</title>
<style>
    body, html {
        margin: 0; padding: 0;
        width: 2100px; height: 2970px;
        background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
        overflow: hidden; position: relative;
        font-family: sans-serif;
    }

    .bubble-container {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
    }

    .bubble {
        position: absolute;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        box-shadow: inset -20px -20px 40px rgba(0,0,0,0.1), inset 20px 20px 40px rgba(255,255,255,0.2);
    }

    /* Central Curved Rectangle */
    .glass-frame {
        position: absolute; top: 150px; left: 150px;
        width: 1800px; height: 2670px;
        background: rgba(255, 255, 255, 0.4);
        border: 4px solid rgba(255, 255, 255, 0.8);
        border-radius: 60px; /* Heavily curved edges */
        backdrop-filter: blur(25px); /* Strong frosted glass effect */
        -webkit-backdrop-filter: blur(25px);
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3), inset 0 0 40px rgba(255, 255, 255, 0.1);
        z-index: 10;
    }
</style>
</head>
