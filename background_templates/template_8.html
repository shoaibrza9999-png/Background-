<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python Fluid Wave - A4 Portrait</title>
<style>
    body, html {
        margin: 0;
        padding: 0;
        width: 2100px;
        height: 2970px;
        background-color: #212529;
        overflow: hidden;
        position: relative;
    }

    /* Dot pattern */
    .dots {
        position: absolute;
        width: 100%;
        height: 100%;
        background-image: radial-gradient(rgba(255, 255, 255, 0.06) 2px, transparent 2px);
        background-size: 60px 60px;
        z-index: 1;
    }

    /* Smooth fluid shapes using gradients and blur */
    .fluid {
        position: absolute;
        border-radius: 50%;
        filter: blur(120px);
        opacity: 0.65;
        z-index: 0;
    }

    .fluid-1 {
        width: 1400px;
        height: 1600px;
        top: -10%;
        left: -20%;
        background: linear-gradient(135deg, #007bff 0%, #20c997 100%);
    }

    .fluid-2 {
        width: 1600px;
        height: 1800px;
        bottom: -15%;
        right: -25%;
        background: linear-gradient(135deg, #ffc107 0%, #fd7e14 100%);
    }
</style>
</head>
<body>
    <div class="dots"></div>
    <div class="fluid fluid-1"></div>
    <div class="fluid fluid-2"></div>
</body>
</html>
