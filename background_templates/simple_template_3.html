<!DOCTYPE html>
<html lang="en">
<head>
<style>
    body, html {
        margin: 0; padding: 0;
        width: 2100px; height: 2970px;
        background-color: #212529;
        overflow: hidden; position: relative;
    }
    .line {
        position: absolute;
        background-color: #4dabf7;
    }
    .line-h { top: 300px; left: 0; width: 600px; height: 4px; }
    .line-v { top: 0; right: 400px; width: 4px; height: 800px; }
    .circle {
        position: absolute;
        border-radius: 50%;
        background-color: #ffd43b;
    }
    .c1 { top: 280px; left: 580px; width: 44px; height: 44px; }
    .c2 { top: 780px; right: 380px; width: 44px; height: 44px; }
    .c3 { bottom: 200px; left: 200px; width: 100px; height: 100px; border: 8px solid #4dabf7; background: transparent; }
</style>
</head>
<body>
    <div class="line line-h"></div>
    <div class="line line-v"></div>
    <div class="circle c1"></div>
    <div class="circle c2"></div>
    <div class="circle c3"></div>
</body>
</html>
