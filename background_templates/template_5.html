<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python Fluid Wave Background</title>
<style>
    body, html {
        margin: 0;
        padding: 0;
        width: 1920px;
        height: 1080px;
        background-color: #212529;
        overflow: hidden;
        position: relative;
    }

    /* Dot pattern */
    .dots {
        position: absolute;
        width: 100%;
        height: 100%;
        background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
        background-size: 40px 40px;
        z-index: 1;
    }

    /* Smooth fluid shapes using gradients and blur */
    .fluid {
        position: absolute;
        border-radius: 50%;
        filter: blur(90px);
        opacity: 0.6;
        z-index: 0;
    }

    .fluid-1 {
        width: 900px;
        height: 800px;
        top: -10%;
        left: -15%;
        background: linear-gradient(135deg, #007bff 0%, #20c997 100%);
    }

    .fluid-2 {
        width: 1000px;

  height: 900px;
        bottom: -20%;
        right: -10%;
        background: linear-gradient(135deg, #ffc107 0%, #fd7e14 100%);
    }
</style>
</head>
<body>
    <div class="dots"></div>
    <div class="fluid fluid-1"></div>
    <div class="fluid fluid-2"></div>
</body>
</html>
