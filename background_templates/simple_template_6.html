<!DOCTYPE html>
<html lang="en">
<head>
<style>
    body, html {
        margin: 0; padding: 0;
        width: 2100px; height: 2970px;
        background-color: #f8f9fa;
        overflow: hidden; position: relative;
    }
    .corner {
        position: absolute;
    }
    .top-left-h { top: 100px; left: 100px; width: 600px; height: 40px; background-color: #3776AB; }
    .top-left-v { top: 100px; left: 100px; width: 40px; height: 600px; background-color: #3776AB; }
    .bottom-right-h { bottom: 100px; right: 100px; width: 600px; height: 40px; background-color: #FFD43B; }
    .bottom-right-v { bottom: 100px; right: 100px; width: 40px; height: 600px; background-color: #FFD43B; }
</style>
</head>
<body>
    <div class="corner top-left-h"></div>
    <div class="corner top-left-v"></div>
    <div class="corner bottom-right-h"></div>
    <div class="corner bottom-right-v"></div>
</body>
</html>
